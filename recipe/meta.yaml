{% set name = "ewah-bool-utils" %}
{% set version = "1.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-','_') }}-{{ version }}.tar.gz
  sha256: 9e1d472724debba95cdc8bd1ac7a082a84ce263dcf4e2700b20954fc9c0a5d65
  patches:
    - patches/0001-dont-install-tests-as-package-data.patch

build:
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - meson-python >=0.18.0
    - meson >=1.6.0
    - ninja-base
    - cython >=3.1.1
    - numpy {{ numpy }}
  run:
    - python
    - numpy >=1.23.2,<3

test:
  source_files:
    - tests
  imports:
    - ewah_bool_utils
  commands:
    - pip check
    - pytest -vv
  requires:
    - pip
    - pytest

about:
  home: https://pypi.org/project/ewah-bool-utils/
  summary: EWAH Bool Array utils for yt
  description: EWAH Bool Array utils for yt
  license: Apache-2.0 AND BSD-3-Clause
  license_file:
    - LICENSE
    - src/ewah_bool_utils/cpp/LICENSE
  license_family: OTHER
  doc_url: https://pypi.org/project/ewah-bool-utils/
  dev_url: https://github.com/yt-project/ewah_bool_utils/

extra:
  recipe-maintainers:
    - neutrinoceros
    - matthewturk
